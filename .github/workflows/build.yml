name: build

# Legacy Python build (manual only). The product is the Rust MetaBrain.exe: see rust.yml.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  exe:
    needs: test
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: build\build_exe.bat
        shell: cmd
      - run: Compress-Archive -Path dist\MetaBrain\* -DestinationPath MetaBrain-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: MetaBrain-windows, path: MetaBrain-windows.zip }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: MetaBrain-windows.zip }
